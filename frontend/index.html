<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#fff8fa"/><script>try{const t=localStorage.getItem('lenny-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const p=localStorage.getItem('lenny-palette');document.documentElement.dataset.palette=['blue','lavender','mint','pink','peach','cream'].includes(p)?p:'pink'}catch{document.documentElement.dataset.theme=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.palette='pink'}</script><title>Lenny Growth Assistant</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
