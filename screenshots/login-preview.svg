<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Lenny Growth Assistant sign-in preview</title>
  <desc id="desc">Illustrated sign-in page with workspace introduction, sign-in and registration tabs, and account form.</desc>
  <defs><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#fff0f5"/><stop offset="1" stop-color="#f8e8ee"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#553947" flood-opacity=".09"/></filter><style>.eyebrow{font:700 11px system-ui,sans-serif;letter-spacing:1.7px;fill:#a55b77}.copy{font:16px system-ui,sans-serif;fill:#765b66}.h{font:700 32px system-ui,sans-serif;fill:#492c3a}.form{font:15px system-ui,sans-serif;fill:#473842}.muted{font:12px system-ui,sans-serif;fill:#998b92}</style></defs>
  <rect width="1200" height="620" rx="24" fill="#fffafb"/>
  <rect x="38" y="28" width="555" height="564" rx="22" fill="url(#wash)"/>
