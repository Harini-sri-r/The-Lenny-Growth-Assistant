  <rect x="710" y="218" width="378" height="48" rx="11" fill="#fff0f4" stroke="#f0d5df"/><rect x="716" y="223" width="183" height="38" rx="9" fill="#fff"/><text x="773" y="247" class="form" font-size="13" font-weight="700">Sign in</text><text x="953" y="247" class="form" font-size="13">Create account</text>
