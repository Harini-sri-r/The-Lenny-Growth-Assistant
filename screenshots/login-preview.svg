  <text x="128" y="77" class="eyebrow">THE LENNY GROWTH</text><text x="128" y="96" class="muted">INTELLIGENT GROWTH WORKSPACE</text>
  <text x="82" y="216" class="eyebrow">RESEARCH FOR WHAT’S NEXT</text>
  <text x="82" y="272" class="h" font-size="40">Turn growth knowledge</text><text x="82" y="319" class="h" font-size="40">into your next clear</text><text x="82" y="366" class="h" font-size="40">decision.</text>
  <text x="82" y="414" class="copy">Explore practical lessons from Lenny’s Podcast and</text><text x="82" y="439" class="copy">Newsletter, grounded in the source material behind each answer.</text>
  <circle cx="98" cy="492" r="17" fill="#fff" stroke="#edcbd8"/><text x="90" y="497" class="muted">01</text><text x="129" y="490" class="form" font-weight="700">Evidence-grounded answers</text><text x="129" y="509" class="muted">Relevant ideas from the transcript library.</text>
