  <text x="64" y="204" class="txt">Reduce the effort between signup and the feature that solves the user’s</text><text x="64" y="232" class="txt">problem. Use onboarding to guide people to relevant functionality, then</text><text x="64" y="260" class="txt">check whether more users reach that first useful moment. [S1] [S2]</text>
