    <style>.nav{font:14px system-ui,sans-serif;fill:#647084}.body{font:15px system-ui,sans-serif;fill:#202b40}.muted{font:12px system-ui,sans-serif;fill:#8290a3}.head{font:700 17px system-ui,sans-serif;fill:#1b2940}.tiny{font:700 10px system-ui,sans-serif;letter-spacing:1px;fill:#8791a0}</style>
