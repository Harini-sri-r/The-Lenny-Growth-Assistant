<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Lenny Growth Assistant workspace preview</title>
  <desc id="desc">Illustrated preview of the chat app with conversation sidebar, cited answer, and research and artifacts panel.</desc>
