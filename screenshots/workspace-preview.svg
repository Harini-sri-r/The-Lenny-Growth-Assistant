  <rect x="282" y="124" width="640" height="91" rx="17" fill="#ffeaf0" stroke="#f2ceda"/>
  <text x="303" y="157" class="body">How can I help new users experience the product’s core value</text><text x="303" y="184" class="body">as quickly as possible?</text>
  <text x="282" y="255" class="tiny">LENNY ASSISTANT</text>
  <text x="282" y="287" class="body">Reduce friction in the first experience and help users reach a useful</text><text x="282" y="314" class="body">feature sooner. Start by identifying the user characteristics that point</text><text x="282" y="341" class="body">to the right next step, then measure whether activation improves. [S1]</text>
