<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Appearance settings preview</title>
  <desc id="desc">Illustrated settings page with white and black theme choices, pastel color palettes, and a live preview.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#fffafb"/><stop offset="1" stop-color="#f7f3ff"/></linearGradient><style>.h{font:700 20px system-ui,sans-serif;fill:#202b40}.txt{font:14px system-ui,sans-serif;fill:#48556b}.muted{font:12px system-ui,sans-serif;fill:#8490a3}.eyebrow{font:700 10px system-ui,sans-serif;letter-spacing:1.3px;fill:#7961b4}</style></defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)"/><rect x="0" y="0" width="260" height="620" rx="24" fill="#f1eaff"/><text x="36" y="57" class="h">Account settings</text><text x="36" y="121" class="muted">Profile</text><rect x="20" y="144" width="220" height="48" rx="11" fill="#fff"/><text x="36" y="174" class="h" font-size="15">Appearance</text><text x="36" y="224" class="muted">Security</text><text x="36" y="269" class="muted">Data &amp; privacy</text>
  <rect x="305" y="49" width="850" height="527" rx="22" fill="#fff" stroke="#e7dcfb"/><text x="348" y="96" class="eyebrow">APPEARANCE</text><text x="348" y="137" class="h" font-size="27">Make it yours</text><text x="348" y="165" class="muted">Choose a workspace mode and a soft accent color.</text>
  <rect x="348" y="196" width="370" height="72" rx="14" fill="#fff" stroke="#a98bdd" stroke-width="2"/><rect x="367" y="213" width="38" height="38" rx="8" fill="#fff" stroke="#d4c9ea"/><text x="421" y="242" class="txt">White mode</text>
  <rect x="735" y="196" width="376" height="72" rx="14" fill="#fff" stroke="#e3dcf1"/><rect x="754" y="213" width="38" height="38" rx="8" fill="#171a24"/><text x="808" y="242" class="txt">Black mode</text>
  <text x="348" y="318" class="h" font-size="16">Pastel color</text><text x="348" y="343" class="muted">Accents stay soft; content keeps clear contrast.</text>
  <g><rect x="348" y="367" width="235" height="76" rx="13" fill="#fff" stroke="#e3dcf1"/><rect x="366" y="382" width="24" height="18" rx="6" fill="#e7efff"/><rect x="394" y="382" width="24" height="18" rx="6" fill="#abc8ff"/><rect x="422" y="382" width="24" height="18" rx="6" fill="#356ce6"/><text x="366" y="427" class="txt" font-size="13">Pastel Blue</text>
  <rect x="598" y="367" width="235" height="76" rx="13" fill="#f3eaff" stroke="#8d69ce" stroke-width="2"/><rect x="616" y="382" width="24" height="18" rx="6" fill="#f0e7ff"/><rect x="644" y="382" width="24" height="18" rx="6" fill="#c8a9f5"/><rect x="672" y="382" width="24" height="18" rx="6" fill="#8051bd"/><text x="616" y="427" class="txt" font-size="13">Pastel Lavender  ✓</text>
  <rect x="848" y="367" width="263" height="76" rx="13" fill="#fff" stroke="#e3dcf1"/><rect x="866" y="382" width="24" height="18" rx="6" fill="#e8f7f0"/><rect x="894" y="382" width="24" height="18" rx="6" fill="#b2e1ca"/><rect x="922" y="382" width="24" height="18" rx="6" fill="#367f5d"/><text x="866" y="427" class="txt" font-size="13">Pastel Mint</text></g>
  <rect x="348" y="468" width="763" height="83" rx="14" fill="#f2eaff" stroke="#d9c8fb"/><text x="370" y="500" class="h" font-size="15">Live preview</text><text x="370" y="526" class="txt">Clear ideas, grounded in evidence.</text><text x="370" y="543" class="muted">Selected colors apply across the workspace.</text>
</svg>
