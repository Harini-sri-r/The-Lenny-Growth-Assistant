services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    env_file: .env
    environment:
      TRANSCRIPTS_PATH: /workspace/lennys-newsletterpodcastdata-main
      DATABASE_URL: postgresql+psycopg://lenny:lenny@db:5432/lenny
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_PERSIST_DIRECTORY: /app/chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./lennys-newsletterpodcastdata-main:/workspace/lennys-newsletterpodcastdata-main:ro
      - chroma_data:/app/chroma
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lenny
      POSTGRES_USER: lenny
      POSTGRES_PASSWORD: lenny
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lenny -d lenny"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  chroma_data:
